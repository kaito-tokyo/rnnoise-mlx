[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnnoise-mlx"
version = "0.1.0"
description = "Train, convert, and validate RNNoise-family denoisers with MLX"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
    "coremltools",
    "mlflow-skinny>=3,<4",
    "mlx>=0.31.2,<0.32",
    "numpy>=2",
    "safetensors",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnnoise_mlx*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["src/rnnoise_mlx/tests"]
