[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnnoise-mlx"
version = "0.1.0"
description = "Train, convert, and validate RNNoise-family denoisers with MLX"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
    "numpy>=2",
    "safetensors",
    "mlx>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx[cpu]>=0.32.2,<0.33; platform_system == 'Linux'",
]

[project.optional-dependencies]
torch = ["torch"]
cuda = ["mlx[cuda12]>=0.32.2,<0.33; platform_system == 'Linux'"]
dev = [
    "ruff>=0.12",
]
conversion = ["coremltools", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnnoise_mlx*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
